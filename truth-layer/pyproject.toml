[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "attested-memory-truth-layer"
version = "0.1.0"
description = "Evidence packs and contradiction indicators for Attested Memory Hub"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "dilithium-py>=1.4,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]
