name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c5e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install services and the client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e memory-market -e truth-layer -e provenance-ledger -e clients/python
      - name: Service and contract tests
        run: |
          python -m pytest -q memory-market/tests truth-layer/tests provenance-ledger/tests tests
      - name: Client tests
        run: python -m pytest -q clients/python/tests
